  <path d="M64 294H1216" stroke="url(#baseline)" stroke-width="2" />
  <text x="72" y="275" fill="#596878" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="10" letter-spacing="1.1">PEOPLE × AGENTS × TOOLS × KNOWLEDGE × WORKFLOWS × OPERATIONS</text>
  <text x="1184" y="274" text-anchor="end" fill="#006E88" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="10" letter-spacing="1.2">WORK, MULTIPLIED.</text>
